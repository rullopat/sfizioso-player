name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      # Pin the WebView UI build runtime separately from the GitHub Action runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Sfizioso Player (VST3 / AU / Standalone)
        run: cmake --build build --config Release

      - name: Package macOS artifacts
        run: |
          mkdir -p artifacts/macos
          tar -czf artifacts/macos/sfizioso-player-macos.tar.gz \
            -C "build/SfiziosoPlayer_artefacts/Release" \
            "Standalone/Sfizioso Player.app" \
            "AU/Sfizioso Player.component" \
            "VST3/Sfizioso Player.vst3"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sfizioso-player-macos
          if-no-files-found: error
          path: artifacts/macos/sfizioso-player-macos.tar.gz

  linux:
    name: build and validate (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux build and WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build xvfb xauth \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Sfizioso Player (VST3 / Standalone)
        run: cmake --build build

      - name: Validate VST3
        run: |
          curl -L --fail --retry 3 -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          echo "c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352  pluginval.zip" \
            | sha256sum --check
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
          xvfb-run -a pluginval/pluginval --strictness-level 5 --validate \
            "$PWD/build/SfiziosoPlayer_artefacts/Release/VST3/Sfizioso Player.vst3"

      - name: Package Linux artifacts
        run: |
          mkdir -p artifacts/linux
          tar -czf artifacts/linux/sfizioso-player-linux.tar.gz \
            -C "build/SfiziosoPlayer_artefacts/Release" \
            "Standalone/Sfizioso Player" \
            "VST3/Sfizioso Player.vst3"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sfizioso-player-linux
          if-no-files-found: error
          path: artifacts/linux/sfizioso-player-linux.tar.gz

  windows:
    name: build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install WebView2 SDK
        shell: pwsh
        run: >
          nuget install Microsoft.Web.WebView2
          -Version 1.0.3485.44
          -OutputDirectory "$env:RUNNER_TEMP\webview2"
          -NonInteractive
          -Source https://api.nuget.org/v3/index.json

      - name: Configure and build Sfizioso Player (VST3 / Standalone)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if "%VS_PATH%"=="" exit /b 1
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="%RUNNER_TEMP%\webview2"
          cmake --build build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sfizioso-player-windows
          if-no-files-found: warn
          path: |
            build/SfiziosoPlayer_artefacts/Release/VST3/Sfizioso Player.vst3
            build/SfiziosoPlayer_artefacts/Release/Standalone/Sfizioso Player.exe
